id: service:auth.auth-service@backend
kind: InternalService
name: Auth Service
status: applied
spec:
  featureId: feature:auth.login
  targetId: target:backend
  interface:
    - { method: login, input: LoginDto, output: "{ accessToken, refreshToken }" }
    - { method: register, input: RegisterDto, output: User }
    - { method: refresh, input: string, output: "{ accessToken }" }
  usesServices: []
  callsExternal:
    - ext:oauth
