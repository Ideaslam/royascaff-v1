id: endpoint:auth.forgot-password@backend
kind: Endpoint
name: Forgot Password
status: applied
spec:
  featureId: feature:auth.password-reset
  targetId: target:backend
  method: POST
  route: /auth/forgot-password
  auth: public
  input:
    body:
      - { name: email, type: string, required: true }
  output:
    status: 200
    shape: "{ ok: boolean }"
    fields:
      - { name: ok, type: boolean, required: true }
  errors:
    - { status: 200, when: always (do not reveal whether the email exists) }
  usesServices:
    - service:auth.auth-service@backend
  touchesEntities:
    - entity:user
