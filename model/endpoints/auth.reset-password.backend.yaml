id: endpoint:auth.reset-password@backend
kind: Endpoint
name: Reset Password
status: applied
spec:
  featureId: feature:auth.password-reset
  targetId: target:backend
  method: POST
  route: /auth/reset-password
  auth: public
  input:
    body:
      - { name: token, type: string, required: true }
      - { name: newPassword, type: string, required: true }
  output:
    status: 200
    shape: "{ ok: boolean }"
    fields:
      - { name: ok, type: boolean, required: true }
  errors:
    - { status: 400, when: invalid or expired reset token }
  usesServices:
    - service:auth.auth-service@backend
  touchesEntities:
    - entity:user
