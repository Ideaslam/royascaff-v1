  - { from: endpoint:auth.login@backend, type: touchesEntity, to: entity:user }
  - { from: endpoint:data.upload-file@backend, type: touchesEntity, to: entity:csv-file }
  - { from: endpoint:data.list-files@backend, type: touchesEntity, to: entity:csv-file }
  - { from: endpoint:data.update-columns@backend, type: touchesEntity, to: entity:column-metadata }
  - { from: endpoint:dashboards.create@backend, type: touchesEntity, to: entity:dashboard }
  - { from: endpoint:dashboards.chart-data@backend, type: touchesEntity, to: entity:chart-widget }
