  - { from: page:auth.login@web, type: callsEndpoint, to: endpoint:auth.login@backend }
  - { from: page:data.upload-wizard@web, type: callsEndpoint, to: endpoint:data.upload-file@backend }
  - { from: page:data.upload-wizard@web, type: callsEndpoint, to: endpoint:data.update-columns@backend }
  - { from: page:data.files-list@web, type: callsEndpoint, to: endpoint:data.list-files@backend }
