  - { from: module:sharing, type: dependsOn, to: module:dashboards }
  - { from: module:export, type: dependsOn, to: module:dashboards }
  - { from: module:notifications, type: dependsOn, to: module:auth }
  - { from: module:subscriptions, type: dependsOn, to: module:users }
  - { from: module:audit, type: dependsOn, to: module:auth }
  - { from: module:settings, type: dependsOn, to: module:auth }

